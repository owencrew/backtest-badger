name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  public-feed:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.node-version
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - run: uv python install 3.12
      - run: uv sync --locked
      - run: pnpm --dir web install --frozen-lockfile
      # Root pytest testpaths intentionally excludes web/tests. These exercise
      # Python provenance/staging and strict TypeScript contracts together.
      - run: uv run --locked pytest -q web/tests
  test:
    # 26.04 uses quota-limited tmpfs for /tmp; guarded fixtures also use /tmp
    # explicitly, so TMPDIR alone cannot move all of their data onto disk.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: badger_test
          POSTGRES_PASSWORD: disposable_test_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U badger_test -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BADGER_TEST_ADMIN_DSN: >-
        host=127.0.0.1 port=5432 dbname=postgres
        user=badger_test password=disposable_test_only
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - name: Storage before Python tests
        run: |
          df -h / /tmp "$RUNNER_TEMP"
          df -i / /tmp "$RUNNER_TEMP"
          findmnt -T /tmp
      # Clean at session exit: per-test cleanup ("failed") conflicts with
      # scientific I/O guards that are still active during fixture teardown.
      - run: uv run --locked pytest -o tmp_path_retention_policy=none
      - name: Storage after Python tests
        if: always()
        # Some system-owned /tmp directories may not be readable.
        continue-on-error: true
        run: |
          df -h / /tmp "$RUNNER_TEMP"
          df -i / /tmp "$RUNNER_TEMP"
          du -h --max-depth=1 /tmp | sort -h | tail -20
          if [ -d "/tmp/pytest-of-$(id -un)" ]; then
            du -h --max-depth=2 "/tmp/pytest-of-$(id -un)" | sort -h | tail -30
          fi
      - name: E.5 guarded fabricated preparation tests (87 required)
        run: uv run --locked --no-sync --python 3.12 python -I -S -B tests/run_e5_guarded.py
      - name: E.5c guarded fabricated integration tests (55 required)
        run: uv run --locked --no-sync --python 3.12 python -I -S -B tests/run_e5c_guarded.py
      - name: E.5d guarded fabricated custody and preparation tests (153 required)
        run: uv run --locked --no-sync --python 3.12 python -I -S -B tests/run_e5d_guarded.py
