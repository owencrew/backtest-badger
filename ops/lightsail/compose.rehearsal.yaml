# D2A only; rehearsal.py validates every resolved target before use.
services:
  postgres:
    image: ${POSTGRES_IMAGE:?Reviewed immutable digest required}
    platform: linux/amd64
    pull_policy: never
    restart: "no"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Isolated database required}
      POSTGRES_USER: d2a_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Private password required}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    labels:
      badger.d2a: ${REHEARSAL_ID:?Unique rehearsal ID required}
    ports:
      - "127.0.0.1:55437:5432"
    volumes:
      - rehearsal_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1.0
    shm_size: 128m
    pids_limit: 128
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "max_connections=30", "-c", "work_mem=4MB", "-c", "maintenance_work_mem=64MB"]
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  rehearsal_data:
    external: true
    name: ${REHEARSAL_VOLUME:?Explicit rehearsal volume required}
