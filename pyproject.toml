[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "backtest-badger"
version = "0.1.0"
description = "A little badger. A lot of backtests. A minimal foundation for quantitative research."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{ name = "Owen Crew" }]
dependencies = [
    "alembic>=1.16,<2",
    "cryptography>=46,<47",
    "numpy>=2,<3",
    "psycopg[binary]>=3.2,<4",
    "scikit-learn>=1.7,<2",
]

[project.scripts]
badger = "backtest_badger.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/backtest_badger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: requires an explicitly configured disposable PostgreSQL server"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
